<html lang="ko">

<link rel="icon" href="data:,">
<style>
  /* 보라빛 둥근 큐브 젤리 하나 + 소리찰흙 모듈. 07 크리스탈과 같은 틀. 기본은 글자 없음, H 키로 패널·버튼 켜기
     (2026-11-22 단순화: 예전 HUD 글자·파형 5종·자체 합성기·타임라인·녹화는 뺌 → index_before-simple.html) */
  html,body{margin:0;height:100%;background:#9f98c7;display:grid;place-items:center;overflow:hidden;font:11px/1.45 Inter,system-ui,sans-serif;color:#fff}
  #stage{position:relative;width:min(100vmin,720px);aspect-ratio:1/1}
  #stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
  .off{display:none!important}
  /* HUD: MIX RATIO · SHAPE → VOICE 형식(흰 선·작은 글자) */
  #hud{position:absolute;left:16px;top:16px;width:150px;pointer-events:none;mix-blend-mode:difference}
  #hud h4{margin:12px 0 2px;font:600 13px/1 "Barlow Condensed",Inter,sans-serif;letter-spacing:.03em}
  #hud .rule{height:1px;background:#fff;margin:4px 0 6px}
  #hud .row{display:flex;justify-content:space-between;font-size:10px;margin-top:5px}
  #hud .sub{font-size:8px;opacity:.7;margin-top:-1px}
  #hud .bar{height:3px;background:#fff;margin-top:2px}
  #hud .track{height:1px;background:#fff6;margin-top:-2px}
  #ctl{position:absolute;left:12px;right:12px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  #ctl button,#ctl select{font:inherit;background:#0003;color:#fff;border:1px solid #fff6;border-radius:4px;padding:3px 8px;cursor:pointer}
  #ctl select option{color:#000}
  #hint{position:absolute;left:12px;right:12px;bottom:64px;font-size:10px;opacity:.85;mix-blend-mode:difference;pointer-events:none}
  #hkey{position:absolute;right:10px;bottom:8px;font-size:10px;opacity:.3;color:#000;pointer-events:none}
  #feel{position:absolute;right:12px;top:12px;width:250px;max-height:calc(100% - 70px);overflow:auto;background:#1c1830e6;border:1px solid #fff3;border-radius:8px;padding:10px 12px;z-index:50}
  #feel label{display:block;margin:6px 0} #feel label div{display:flex;justify-content:space-between;opacity:.85}
  #feel input[type=range]{width:100%}
  #feel .bar{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  #feel button,#feel input[type=text]{font:inherit;background:#0006;color:#fff;border:1px solid #fff4;border-radius:4px;padding:3px 6px}
  #feel input[type=text]{width:100%;box-sizing:border-box;margin-bottom:4px}

<body>
<div id="stage">
  <div id="hud" class="off"></div>
  <div id="hint" class="off">왼드래그 당기기 · Ctrl 드래그 홈 · 오른드래그(Shift) 문지르기: 천천히=SINE 왔다갔다=SQUARE 빠르게=WHITE 튕기기=NEEDLE 꾹=PINK · Alt 지우기 · 휠 찰흙 더하기/덜기 · F 브러시 크기 · Shift+F 세기 · Ctrl+Z / Ctrl+Shift+Z · 만진 젤리는 계속 노래(■ 모두 멈춤) · 🎤·🎵(끌어다 놓기)는 젤리가 들음 · H 숨기기</div>
  <div id="ctl" class="off"></div>
  <div id="feel" class="off"></div>
  <div id="hkey">H</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
// 모듈 원본(이 폴더가 관리 위치 — 여기서 고치지 않음)
import { createSoundClay, SHAPES, VOICES, WAVES, FEEL_SCHEMA, RULES } from './sound-clay.js';

/* ---------------------------------------------------------------
   옵션
   ?mute=1   → 소리 계산만, 스피커 출력 없음(테스트는 항상 이걸로)
   ?hud=1    → 패널·버튼 켠 채로 시작(기본은 꺼짐, H 키로 토글)
   ?mix=A / ?mix=prog → 조합 모드(모듈이 목소리·코드를 정함, 규칙 5-2절)
   --------------------------------------------------------------- */
/* ---------- 소리 잠금 풀기(모듈은 그대로, 바깥에서만) ----------
   폰·임베드 창에서는 손짓 밖에서 만든 AudioContext가 'suspended'로 멈춰 있음 → 모듈이 만드는 모든 AudioContext를 기억했다가 터치·클릭 때마다 resume.
   iOS는 무음 스위치가 켜져 있으면 Web Audio가 안 나옴 → 첫 터치에 무음 <audio>를 한 번 재생해 재생 모드로 바꿈.
   임베드 창 보안 정책이 blob: 워크릿을 막으면 data: 주소로 다시 시도. 상태는 첫 터치 뒤 8초 동안 오른쪽 아래(H 자리)에 보임 */
const AUDIO = { ctxs: new Set(), err: '' };
{
  const AC0 = window.AudioContext || window.webkitAudioContext;
  if (AC0) {
    window.AudioContext = class extends AC0 { constructor(...a) { super(...a); AUDIO.ctxs.add(this); if (this.state !== 'running') this.resume().catch(() => {}); } };
    if (window.AudioWorklet) {
      const addM = AudioWorklet.prototype.addModule;
      AudioWorklet.prototype.addModule = async function (url, opt) {
        try { return await addM.call(this, url, opt); }
        catch (e) {
          if (!String(url).startsWith('blob:')) { AUDIO.err = e.message; throw e; }
          try { const txt = await (await fetch(url)).text(); return await addM.call(this, 'data:text/javascript;base64,' + btoa(unescape(encodeURIComponent(txt))), opt); }
          catch (e2) { AUDIO.err = e2.message; throw e2; }
        }
      };
    }
  }
  let silent = null, shownAt = 0;
  const unlock = () => {
    AUDIO.ctxs.forEach(c => { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); });
    if (!silent) {   // iOS 무음 스위치 우회: 아주 짧은 무음 wav 재생
      silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
      silent.setAttribute('playsinline', ''); silent.play().catch(() => {});
      shownAt = performance.now();
      const tick = () => { const el = document.getElementById('hkey'); if (!el) return;
        if (performance.now() - shownAt > 8000) { el.textContent = 'H'; return; }
        const st = [...AUDIO.ctxs].map(c => c.state).join(',') || '-';
        el.textContent = 'H · 소리 ' + st + (AUDIO.err ? ' · ' + AUDIO.err.slice(0, 40) : ''); setTimeout(tick, 300); };
      tick();
    }
  };
  ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));
}
const q = new URLSearchParams(location.search);
const MUTE = q.has('mute');

/* ---------- 렌더러·장면(예전 화면과 같은 값) ---------- */
const stage = document.getElementById('stage');
const SIZE = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });   // preserveDrawingBuffer: 검증 캡처용
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(SIZE, SIZE, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
// 라벤더 배경(좌상단 밝고 우하단 살짝 진함)
{ const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 512, 512); lg.addColorStop(0, '#c6c1e2'); lg.addColorStop(1, '#b0a8d6');
  g.fillStyle = lg; g.fillRect(0, 0, 512, 512);
  const rg = g.createRadialGradient(170, 300, 10, 170, 300, 260); rg.addColorStop(0, 'rgba(255,255,255,.12)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }

const pmrem = new THREE.PMREMGenerator(renderer);
// RoomEnvironment에 색 조명을 섞어 박막 반사에 청록·마젠타가 잘 생기게 함
const envScene = new RoomEnvironment();
const addLight = (color, pos, s) => { const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color }));
  m.material.color.multiplyScalar(s); m.position.set(...pos); m.scale.set(3, 3, .2); m.lookAt(0, 0, 0); envScene.add(m); };
addLight(0x20ffc0, [-6, 2, 4], 10); addLight(0xff30d0, [6, -2, 3], 10); addLight(0x6a70ff, [0, 6, -4], 8); addLight(0x30e0ff, [2, -6, 2], 7);
scene.environment = pmrem.fromScene(envScene, 0.03).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 8.4);

/* ---------- 젤리 재질(보라빛 박막 + 순환 4색 테두리) ---------- */
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const SETTLE_T = 4.2;   // 예전 타임라인에서 큐브가 가라앉은 순간 — 그 순간의 색·자세를 고정값으로 씀
function makeJellyMaterial() {
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xe4c4ff, metalness: 0.12, roughness: 0.2,
    transmission: 0.22, thickness: 1.0, ior: 1.4,
    iridescence: 1, iridescenceIOR: 2.0, iridescenceThicknessRange: [120, 820],
    clearcoat: 1, clearcoatRoughness: 0.12,
    envMapIntensity: 1.6,
  });
  const filmU = { uHue: { value: 0.62 - 0.28 * ss(3.5, 10, SETTLE_T) }, uMix: { value: 0.9 + 0.55 * ss(4.5, 11, SETTLE_T) } };
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, filmU);
    sh.fragmentShader = 'uniform float uHue; uniform float uMix;\n' + sh.fragmentShader;
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', `
    {
      vec3 Nv=normalize(normal); vec3 Vv=normalize(vViewPosition);
      float fr=1.0-abs(dot(Nv,Vv));
      // 순환 4색: 마젠타 → 보라 → 청록 → 초록
      float h=fract(fr*1.15 + Nv.y*0.28 - Nv.x*0.22 + uHue);
      vec3 c0=vec3(1.0,0.36,0.92), c1=vec3(0.56,0.42,1.0), c2=vec3(0.08,0.88,0.86), c3=vec3(0.45,0.98,0.62);
      float k=h*4.0; vec3 pal = k<1.0?mix(c0,c1,k):k<2.0?mix(c1,c2,k-1.0):k<3.0?mix(c2,c3,k-2.0):mix(c3,c0,k-3.0);
      float w=mix(smoothstep(0.3,0.78,fr), 0.55+0.45*fr, uMix-0.9);
      outgoingLight = mix(outgoingLight*vec3(1.0,0.86,1.04), pal*(0.95+0.25*fr), w*min(uMix,1.0));
    }
    #include <opaque_fragment>`);
  };
  return mat;
}

/* ---------- 형상: 둥근 큐브(roundBox, 모듈 SHAPES) ---------- */
const SHAPE = SHAPES.roundBox();   // hx=hy=1, hz=0.92, r=0.28

/* ---------- LAYOUT(예전 화면 자세 그대로: 가라앉은 순간의 회전·위치) ---------- */
const LAYOUT = [
  { name: 'softmatter', pos: [0, 0.06, 0], rot: [0.42 * ss(3.5, 12.5, SETTLE_T), 0.18 - 0.5 * ss(1.0, 12.5, SETTLE_T), 0],
    voice: 'toy', note: 440.00 },   // A4(듣기 좋게: 오르골 음역)
];
/* 듣기 좋은 소리(2026-11-22 사용자 요청 "소리도 좀 듣기좋은소리로 바꿔"): 화음음(A·C#·E)은 그대로 두고
   ① 맡은 음을 A3→A4로 올려 오르골처럼 맑게 ② 박마다 칠 확률 0.42→0.28로 줄여 음 사이에 여백 ③ 고역 차단 2300→1700Hz로 딱딱한 소리를 둥글게.
   박(66BPM)은 그대로라 조합(mix) 페이지의 다른 화면과도 맞음 */
const GENTLE = { toy: { density: 0.28, lp: 1700 } };
/* 화음 모드(sound-clay 5-1절): 다른 화면과 같은 키(A 장화음 A·C#·E). 젤리 하나가 A3을 맡음(toy가 2~3음을 흩어 쳐서 화음이 됨)
   ?mix=A/prog 이면 모듈이 목소리·코드를 정함(여기서 덮어쓰지 않음) */
const KEY = { rootHz: 110, scale: 'chord' };

const jellies = LAYOUT.map((L, i) => {
  const material = makeJellyMaterial();
  const group = new THREE.Group(); scene.add(group);
  const home = new THREE.Vector3(...L.pos);
  group.position.copy(home); group.rotation.set(...L.rot);
  return { name: L.name, index: i, group, material, home, rotHome: group.rotation.clone(), voice: L.voice, note: L.note, clay: null };
});
window.__jellies = jellies; window.__cam = camera;

/* =================================================================
   ▼▼▼ sound-clay 붙이는 자리 (HOOK) — 07 화면과 같은 구조 ▼▼▼
   ================================================================= */
let FEEL = null;
const FEEL_LS = 'soundclay.softmatter.feel.v1';
function attachSoundClay(j) {
  j.clay = createSoundClay({
    THREE, MarchingCubes, parent: j.group, camera, canvas: renderer.domElement,
    material: j.material,                                // 보라빛 젤리 재질이 마칭큐브 표면에 그대로
    base: SHAPE,                                         // 실제 모양: 둥근 큐브
    voice: j.voice, mute: MUTE, feel: FEEL,
    rotateOnEmptyDrag: false,
    exclusiveVoice: false,                               // 만진 젤리는 계속 노래 — 멈추기는 '모두 멈춤'
    key: KEY, note: j.note, rules: GENTLE,
    onFeelChange: f => { saveFeel(f); feelPanel && feelPanel.refresh(); },
  });
  return j.clay;
}
function saveFeel(f) { try { localStorage.setItem(FEEL_LS, JSON.stringify(f)); } catch (_) {} }
/* ▲▲▲ HOOK 끝 ▲▲▲ */

const clays = () => jellies.filter(d => d.clay).map(d => d.clay);
const activeJ = () => jellies.find(d => d.clay && d.clay.active) || null;
const targetJ = () => activeJ() || jellies[0];

/* ---------- 컨트롤(H 키로 표시) ---------- */
let feelPanel = null;
function buildUI() {
  const ctl = document.getElementById('ctl');
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; ctl.appendChild(b); return b; };
  const sel = document.createElement('select');
  VOICES.forEach(v => { const op = document.createElement('option'); op.value = v; op.textContent = '목소리: ' + v; sel.appendChild(op); });
  sel.onchange = () => { const d = targetJ(); d.clay.setVoice(sel.value); d.voice = sel.value; };
  ctl.appendChild(sel);
  const snd = btn('🔊 소리', () => { const d = targetJ(); d.clay.state.playing ? d.clay.stop() : d.clay.start(); });
  btn('■ 모두 멈춤', () => clays().forEach(c => c.state.playing && c.stop()));
  let listener = null;
  const micB = btn('🎤 내 목소리', async () => {
    if (listener && listener.clay.listening === 'MIC') { listener.clay.stopListening(); listener = null; }
    else { stopAllListening(); listener = targetJ(); listener.clay.activate();
      try { await listener.clay.listen('mic'); } catch (e) { alert('마이크를 못 열었어(내장 브라우저 창에선 막힘 → 크롬 localhost로): ' + e.message); listener = null; } }
    showListen(); });
  const fileB = btn('🎵 음성 파일', () => { if (listener && listener.clay.listening === 'FILE') { listener.clay.stopListening(); listener = null; showListen(); } else afile.click(); });
  const afile = document.createElement('input'); afile.type = 'file'; afile.accept = 'audio/*'; afile.style.display = 'none'; document.body.appendChild(afile);
  const playFile = async f => { stopAllListening(); listener = targetJ(); listener.clay.activate();
    try { await listener.clay.listen(f); } catch (e) { alert('음성 파일을 못 읽었어: ' + e.message); listener = null; } showListen(); };
  afile.onchange = () => { if (afile.files[0]) playFile(afile.files[0]); afile.value = ''; };
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = [...e.dataTransfer.files].find(x => x.type.startsWith('audio/') || /\.(wav|mp3|m4a|ogg|flac|webm)$/i.test(x.name)); if (f) playFile(f); });
  function stopAllListening() { clays().forEach(c => c.listening && c.stopListening()); listener = null; }
  function showListen() { const l = listener && listener.clay.listening;
    micB.textContent = l === 'MIC' ? '⏹ 목소리 끄기 (' + listener.name + ')' : '🎤 내 목소리';
    fileB.textContent = l === 'FILE' ? '⏹ 파일 끄기 (' + listener.name + ')' : '🎵 음성 파일'; }
  const feelB = btn('감각', () => document.getElementById('feel').classList.toggle('off'));
  btn('↺ 젤리 초기화', () => targetJ().clay.reset());
  feelPanel = buildFeelPanel(feelB);
  return { sel, snd };
}
function buildFeelPanel(feelB) {
  const fp = document.getElementById('feel');
  fp.innerHTML = '<b style="font-size:12px">감각 프리셋 (소프트 매터)</b>';
  const setAll = f => { clays().forEach(c => c.setFeel(f)); };
  const cur = () => (jellies[0].clay).getFeel(nameIn.value || 'softmatter');
  const rows = {};
  const nameIn = document.createElement('input'); nameIn.type = 'text'; nameIn.value = (FEEL && FEEL.name) || '기본';
  fp.appendChild(nameIn);
  FEEL_SCHEMA.forEach(f => {
    const row = document.createElement('label'), top = document.createElement('div'), name = document.createElement('span'), t = document.createElement('span');
    name.textContent = f.label; const r = document.createElement('input'); r.type = 'range'; r.min = f.min; r.max = f.max; r.step = f.step;
    const d = Math.max(0, -Math.floor(Math.log10(f.step)));
    r.oninput = () => { setAll({ values: { [f.key]: +r.value } }); t.textContent = (+r.value).toFixed(d); saveFeel(cur()); };
    top.append(name, t); row.append(top, r); fp.appendChild(row); rows[f.key] = { r, t, d };
  });
  const bar = document.createElement('div'); bar.className = 'bar'; fp.appendChild(bar);
  const mkB = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); };
  const refresh = () => { const v = jellies[0].clay.getFeel().values; for (const k in rows) { rows[k].r.value = v[k]; rows[k].t.textContent = (+v[k]).toFixed(rows[k].d); } };
  mkB('복사', async () => { const s = JSON.stringify(cur(), null, 2); try { await navigator.clipboard.writeText(s); feelB.textContent = '감각 ✓복사'; setTimeout(() => feelB.textContent = '감각', 1200); } catch (_) { alert(s); } });
  mkB('파일로 저장', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(cur(), null, 2)], { type: 'application/json' })); a.download = `sound-clay-feel_${nameIn.value || 'softmatter'}.json`; a.click(); });
  const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = '.json,application/json'; fileIn.style.display = 'none'; fp.appendChild(fileIn);
  fileIn.onchange = async () => { const f = fileIn.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); setAll(j); if (j.name) nameIn.value = j.name; refresh(); saveFeel(cur()); } catch (e) { alert('프리셋을 읽지 못했어: ' + e.message); } fileIn.value = ''; };
  mkB('불러오기', () => fileIn.click());
  mkB('기본값', () => { const v = {}; FEEL_SCHEMA.forEach(f => v[f.key] = f.key === 'stiffness' ? RULES.pull.stiffness : f.key === 'spread' ? RULES.pull.spread : f.key.split('.').reduce((a, k) => a[k], RULES));
    if (FEEL_DEFAULT) Object.assign(v, FEEL_DEFAULT.values); setAll({ values: v }); nameIn.value = '기본'; refresh(); saveFeel(cur()); });
  refresh();
  return { refresh };
}

/* ---------- HUD(H 키): MIX RATIO · SHAPE → VOICE ---------- */
const hudEl = document.getElementById('hud');
hudEl.innerHTML = `<div id="hName" class="row" style="margin-top:0"></div>
  <h4>MIX RATIO</h4><div id="hF0" class="sub"></div><div class="rule"></div>` +
  WAVES.map((w, i) => `<div class="row"><span>${w}</span><span id="hp${i}"></span></div><div class="bar" id="hb${i}" style="width:0"></div><div class="track"></div>`).join('') +
  `<h4>SHAPE → VOICE</h4><div class="rule"></div>` +
  [['SIZE', 'PITCH'], ['STRETCH', 'GLIDE'], ['HORN', 'TRILL'], ['LEAN', 'VIBRATO'], ['FLAT', 'NOTE LEN'], ['VOLUME', 'RING']]
    .map(([a, b], i) => `<div class="row"><span>${a}</span><span id="hs${i}"></span></div><div class="sub">→ ${b}</div>`).join('') +
  `<div id="hTag" class="sub" style="margin-top:8px"></div>`;
const $ = id => document.getElementById(id);
function drawHud() {
  const d = targetJ(); if (!d || !d.clay) return;
  const c = d.clay, St = c.state, V = St.voice;
  $('hName').innerHTML = `<span>${d.name.toUpperCase()} · ${c.voice.toUpperCase()}</span><span>${St.playing ? '♪' : (c.listening || '—')}</span>`;
  $('hF0').textContent = St.f0 > 0 ? 'f0 ' + (St.f0 / 1000).toFixed(2) + ' kHz' : 'f0 — (no pitch)';
  St.share.forEach((s, k) => { $('hp' + k).textContent = (s * 100).toFixed(s < 0.1 && s > 0 ? 1 : 0) + '%'; $('hb' + k).style.width = (100 * s).toFixed(1) + '%'; });
  const v = [V.pitch, V.sweep, V.rate, V.vib, V.dur, V.ring];
  v.forEach((x, i) => $('hs' + i).textContent = i === 3 ? '±' + x.toFixed(0) + 'Hz' : i === 5 ? (x * 100).toFixed(0) + '%' : '×' + x.toFixed(2));
  $('hTag').textContent = St.tag + ' · undo ' + c.history.undo;
  if (ui) { ui.sel.value = c.voice; ui.snd.textContent = St.playing ? '🔇 소리 끄기' : '🔊 소리'; }
}
let showHud = q.has('hud');
const setHud = on => { showHud = on; ['hud', 'ctl', 'hint'].forEach(id => $(id).classList.toggle('off', !on)); if (!on) $('feel').classList.add('off'); };
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && !e.ctrlKey && !e.metaKey && !e.altKey && e.target.tagName !== 'INPUT') setHud(!showHud); });

/* ---------- 시작 ---------- */
let FEEL_DEFAULT = null, ui = null;
try { FEEL_DEFAULT = await (await fetch('./feel/기본.json')).json(); } catch (_) {}
try { const s = localStorage.getItem(FEEL_LS); FEEL = s ? JSON.parse(s) : FEEL_DEFAULT; } catch (_) { FEEL = FEEL_DEFAULT; }
jellies.forEach(attachSoundClay);
ui = buildUI(); setHud(showHud);
window.__clays = clays();

/* ---------- 매 프레임: 모듈 갱신(만진 형태 + 은은한 출렁임) → 렌더 ---------- */
function frame(t) {
  for (const j of jellies) if (j.clay) j.clay.update(t);
  if (showHud) drawHud();
  renderer.render(scene, camera);
}
window.__frame = frame;
const loop = ms => { frame(ms / 1000); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
</script>
</body>
</html>
