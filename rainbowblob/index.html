/* ---------------------------------------------------------------
   옵션
   ?mute=1   → 소리 계산만, 스피커 출력 없음(테스트는 항상 이걸로)

   ?hud=1    → 패널·버튼 켠 채로 시작(기본은 꺼짐, H 키로 토글)
   ?u=uK0:0.4 → 재질 값 바꿔 보기(조율용)
   ?rec=1    → 720×1280, 30fps × 315장 프레임을 로컬 서버(/frame/N)로 보냄(영상 만들기용, 소리 꺼짐). ?rec=0,30,60 → 그 프레임만(N = 초×30)
   --------------------------------------------------------------- */
/* ---------- 소리 잠금 풀기(모듈은 그대로, 바깥에서만) ----------
   폰·임베드 창에서는 손짓 밖에서 만든 AudioContext가 'suspended'로 멈춰 있음 → 모듈이 만드는 모든 AudioContext를 기억했다가 터치·클릭 때마다 resume.
   iOS는 무음 스위치가 켜져 있으면 Web Audio가 안 나옴 → 첫 터치에 무음 <audio>를 한 번 재생해 재생 모드로 바꿈.
   임베드 창 보안 정책이 blob: 워크릿을 막으면 data: 주소로 다시 시도. 상태는 첫 터치 뒤 8초 동안 오른쪽 아래(H 자리)에 보임 */
const AUDIO = { ctxs: new Set(), err: '' };
{
  const AC0 = window.AudioContext || window.webkitAudioContext;
  if (AC0) {
    window.AudioContext = class extends AC0 { constructor(...a) { super(...a); AUDIO.ctxs.add(this); if (this.state !== 'running') this.resume().catch(() => {}); } };
    if (window.AudioWorklet) {
      const addM = AudioWorklet.prototype.addModule;
      AudioWorklet.prototype.addModule = async function (url, opt) {
        try { return await addM.call(this, url, opt); }
        catch (e) {
          if (!String(url).startsWith('blob:')) { AUDIO.err = e.message; throw e; }
          try { const txt = await (await fetch(url)).text(); return await addM.call(this, 'data:text/javascript;base64,' + btoa(unescape(encodeURIComponent(txt))), opt); }
          catch (e2) { AUDIO.err = e2.message; throw e2; }
        }
      };
    }
  }
  let silent = null, shownAt = 0;
  const unlock = () => {
    AUDIO.ctxs.forEach(c => { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); });
    if (!silent) {   // iOS 무음 스위치 우회: 아주 짧은 무음 wav 재생
      silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
      silent.setAttribute('playsinline', ''); silent.play().catch(() => {});
      shownAt = performance.now();
      const tick = () => { const el = document.getElementById('hkey'); if (!el) return;
        if (performance.now() - shownAt > 8000) { el.textContent = 'H'; return; }
        const st = [...AUDIO.ctxs].map(c => c.state).join(',') || '-';
        el.textContent = 'H · 소리 ' + st + (AUDIO.err ? ' · ' + AUDIO.err.slice(0, 40) : ''); setTimeout(tick, 300); };
      tick();
    }
  };

   덩어리 반지름(원본 평균 144.2px)을 월드 1.2(소리찰흙 모듈 기준 크기)로 맞추고 카메라 거리를 거꾸로 정함 */

renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // 셰이더가 화면 값을 직접 냄(원본 픽셀값 = 셰이더 값)
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 200);
camera.position.set(0, 0, CAMZ);

const shared = { uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) }, uPh: { value: 0 } };
function fit() {
  let w, h;
  if (REC) { w = VW; h = VH; renderer.setPixelRatio(1); }
  else { h = Math.min(innerHeight, innerWidth / ASPECT); w = h * ASPECT; renderer.setPixelRatio(Math.min(2, devicePixelRatio) * Math.min(1, VH / (h * Math.min(2, devicePixelRatio)))); }
  renderer.setSize(Math.round(w), Math.round(h));
  stage.style.width = Math.round(w) + 'px'; stage.style.height = Math.round(h) + 'px';
  shared.uRes.value.set(Math.round(w) * renderer.getPixelRatio(), Math.round(h) * renderer.getPixelRatio());

  uniform float uTime, uPh; uniform vec2 uRes;

  float vn3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*f*(f*(f*6.0-15.0)+10.0);
    return mix(mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x), mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y),
               mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x), mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y), f.z); }
  // 반복하는 노이즈: 노이즈 공간에서 원을 따라 움직임 → uPh(0~1)가 한 바퀴 돌면 처음 모습
  vec3 loopOff(float k, float rad){ float a = 6.2831853*(uPh*k); return vec3(cos(a), sin(a), 0.37*k)*rad; }
  const vec3 BG = vec3(236.0/255.0);
`;

`;

const SILF = (() => {
  const b = Uint8Array.from(atob(SIL.b64), c => c.charCodeAt(0)), st = SIL.na + 2;
  return SIL.t.map((t, i) => ({ t, cx: (b[i * st] - 128) / 10, cy: (b[i * st + 1] - 128) / 10,
    r: Array.from(b.subarray(i * st + 2, i * st + 2 + SIL.na), v => (v / 3.4 + 90) / SIL.mean) }));
})();
function silAt(ph) {                                   // 주기 안 시간 ph(초) → 64방향 배율·중심(px)
  const F = SILF, n = F.length; let k = n - 1;
  for (let i = 0; i < n - 1; i++) if (F[i + 1].t > ph) { k = i; break; }
  const a = F[k], b = F[(k + 1) % n], tb = k + 1 < n ? b.t : LOOP, u = Math.min(1, Math.max(0, (ph - a.t) / Math.max(1e-4, tb - a.t)));
  return { cx: a.cx + (b.cx - a.cx) * u, cy: a.cy + (b.cy - a.cy) * u, r: a.r.map((x, j) => x + (b.r[j] - x) * u) };
}

/* ---------- 덩어리에 비칠 스튜디오 환경(큐브맵) ----------
   화면 배경은 흰 회색이지만, 원본처럼 덩어리에 비치고 굴절돼 보이는 환경에는 어두운 패널 몇 장과 밝은 소프트박스가 있음.
   짙은 조각 = 휘어진 표면이 이 어두운 패널을 반사·굴절해서 보이는 것, 세로 띠 = 세로로 긴 소프트박스가 굴절돼 보이는 것.
   환경 씬을 CubeCamera로 한 번 찍어 큐브맵으로 씀(셰이더가 반사·굴절 방향으로 읽음) */
const ENV = (() => {
  const es = new THREE.Scene();
  const C = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.LinearSRGBColorSpace);
  const room = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), new THREE.MeshBasicMaterial({ color: C(0.93, 0.93, 0.93), side: THREE.BackSide }));
  es.add(room);
  // 판 하나: [가로, 세로, 위치 x·y·z, 색, 이름]. 판은 늘 원점(덩어리)을 봄
  const P = [
    // 어두운 패널(짙은 남색·검정): 왼쪽 뒤·오른쪽 뒤 아래·아래·왼쪽 위
    [14, 26, -17, -2, -6, C(0.02, 0.05, 0.07)],
    [16, 16, 15, -10, -8, C(0.03, 0.06, 0.08)],
    [10, 22, 20, -2, -14, C(0.03, 0.05, 0.07)],
    [10, 10, -16, -12, 2, C(0.03, 0.05, 0.07)],
    [40, 12, 0, -18, -4, C(0.04, 0.07, 0.09)],
    [12, 10, -11, 13, -10, C(0.02, 0.04, 0.06)],
    [10, 18, 18, 6, 6, C(0.05, 0.08, 0.10)],
    // 밝은 소프트박스(세로로 긴 것 두 장 · 위 · 카메라 뒤 위)
    [5, 30, -6, 0, -22, C(1.12, 1.12, 1.12)],
    [5, 30, 7, 0, -22, C(1.08, 1.08, 1.08)],
    [24, 5, 0, 20, -2, C(2.2, 2.2, 2.2)],
    [16, 4, -4, 12, 18, C(2.0, 2.0, 2.0)],
    [3, 14, 14, 2, 14, C(1.5, 1.5, 1.5)],
  ];
  for (const [w, h, x, y, z, col] of P) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); }
  const rt = new THREE.WebGLCubeRenderTarget(512, { type: THREE.HalfFloatType, generateMipmaps: false });
  const cam = new THREE.CubeCamera(0.1, 200, rt);
  return { es, rt, cam, render() { cam.update(renderer, es); } };
})();

/* ---------- 덩어리 재질 ----------
   정점: (1) 원본 실루엣 표로 방향마다 단면을 늘리고 줄임 → 윤곽이 원본과 같은 자리에서 울퉁불퉁
         (2) 앞·뒷면은 반복 노이즈로 실제로 굴곡지게 밀어냄(높이장) → 둘 다 합친 모양에서 법선을 다시 구함(차분)
   조각: 투명한 유리 + 박막 간섭(물리 순서대로)
     ① 앞면에서 굴절(R·G·B 굴절률 1.44/1.47/1.51, 분산) → 덩어리를 가로지르는 현(공 근사)으로 뒷면 점을 찾고 → 뒷면(노이즈로 굴곡)에서 다시 굴절해 나간 방향으로 환경 큐브맵을 읽음
        (전반사면 안에서 튕긴 방향). 가장자리일수록 많이 꺾여 옆의 어두운 패널·소프트박스가 크게 휘어 비침
     ② 박막: 광로차 2·n·d·cosθt(파장 10개 → RGB). 반사광은 박막 반사율 Rf로 물들고, 투과광은 1−Rf 쪽으로 물듦(보색)
        막이 얇은 곳(접힌 곳)은 1차 간섭색(노랑·주황·빨강)
     ③ 프레넬(Schlick)로 반사·투과를 나눔 */
function makeBlobMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: {
      ...shared,
      uInv: { value: new THREE.Matrix4() }, uGrp: { value: new THREE.Matrix4() }, uR: { value: R }, uGrow: { value: 1 },
      uSil: { value: new Array(64).fill(1) }, uSilAmt: { value: 1 },
      uBump: { value: 0.10 }, uBumpF: { value: 1.25 },
      uEnv: { value: ENV.rt.texture },
      uD0: { value: 1068.0 }, uD1: { value: 152.0 }, uDn: { value: 90.0 }, uThin: { value: 0.6 }, uAbs: { value: 0.06 }, uK0: { value: 0.30 }, uK1: { value: 0.85 },
      uKT: { value: 0.55 }, uKR: { value: 1.0 }, uF0: { value: 0.06 },
      uNrm: { value: 0.09 }, uNrmF: { value: 3.0 }, uNbN: { value: 0.55 }, uZ: { value: 0.85 },
    },
    vertexShader: GLSL + /* glsl */`
      uniform mat4 uInv, uGrp; uniform float uR, uGrow, uSil[64], uSilAmt, uBump, uBumpF;
      varying vec3 vW, vN, vP;
      float silR(float a){ float x = (a/6.2831853)*64.0; x = mod(x + 64.0, 64.0); int i = int(floor(x)); float f = fract(x);
        int j = i + 1; if (j > 63) j = 0; return mix(uSil[i], uSil[j], f); }
      // 쉬는 모양 위 점 g(덩어리 공간)와 쉬는 법선 n → 화면에 보이는 점
      vec3 deform(vec3 g, vec3 n){
        vec3 p = g / (uR*uGrow);
        float a = atan(p.y, p.x);
        float s = mix(1.0, silR(a), uSilAmt);
        g.xy *= s;
        float face = smoothstep(0.25, 0.85, abs(n.z));                     // 앞·뒷면만 굴곡(윤곽은 실루엣 표가 정함)
        float h = vn3(p*uBumpF*2.0 + loopOff(1.0, 1.6) + (n.z < 0.0 ? 11.0 : 0.0))*0.7 + vn3(p*uBumpF*4.1 + loopOff(2.0, 1.2) + 5.0)*0.3 - 0.5;
        g += n * h * uBump * uR * uGrow * face;
        return g;
      }
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.);
        vec3 g = (uInv * wp).xyz;
        vec3 n = normalize(mat3(uInv) * mat3(modelMatrix) * normal);
        vec3 t1 = normalize(cross(n, abs(n.y) < 0.9 ? vec3(0,1,0) : vec3(1,0,0))), t2 = cross(n, t1);
        float e = 0.012 * uR;
        vec3 P0 = deform(g, n), P1 = deform(g + t1*e, n), P2 = deform(g + t2*e, n);
        vec3 nn = normalize(cross(P1 - P0, P2 - P0)); if (dot(nn, n) < 0.0) nn = -nn;
        vP = g / (uR*uGrow);
        wp = uGrp * vec4(P0, 1.);
        vW = wp.xyz; vN = normalize(mat3(uGrp) * nn);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: GLSL_F + /* glsl */`
      uniform mat4 uInv, uGrp; uniform samplerCube uEnv; uniform float uAbs, uD1, uK0, uK1, uD0, uDn, uThin, uKT, uKR, uF0, uNrm, uNrmF, uNbN, uZ;
      varying vec3 vW, vN, vP;
      // 박막 반사율(파장 10개 → RGB). 광로차 opd(nm), 사이 막의 위상 뒤집힘 포함(sin²)
      vec3 film(float opd){
        vec3 s = vec3(0.0), wsum = vec3(0.0);
        for (int i = 0; i < 10; i++){
          float l = 405.0 + float(i)*31.0;
          vec3 w = vec3(exp(-pow((l-605.0)/48.0, 2.0)) + 0.18*exp(-pow((l-430.0)/22.0, 2.0)), exp(-pow((l-545.0)/45.0, 2.0)), exp(-pow((l-452.0)/34.0, 2.0)));
          float r = sin(3.14159265*opd/l); s += w*r*r; wsum += w;
        }
        return s / wsum;
      }
      vec3 envS(vec3 d){ return textureCube(uEnv, d).rgb; }
      void main(){
        vec3 n = normalize(vN), v = normalize(vW - cameraPosition);
        if (dot(n, v) > 0.0) n = -n;
        // 법선 교란: 잔 굴곡 높이장(2옥타브, 반복 노이즈)의 기울기로 법선을 휨(가장자리일수록 셈)
        { float ndv0 = clamp(-dot(n, v), 0.0, 1.0);
          float amp = uNrm * mix(0.3, 1.0, smoothstep(0.8, 0.3, ndv0));
          vec3 q = vP*uNrmF + loopOff(2.0, 1.5) + 40.0; float e = 0.04;
          float h0 = vn3(q) + 0.5*vn3(q*2.1 + 3.0);
          vec3 gr = vec3(vn3(q + vec3(e,0,0)) + 0.5*vn3((q + vec3(e,0,0))*2.1 + 3.0) - h0,
                         vn3(q + vec3(0,e,0)) + 0.5*vn3((q + vec3(0,e,0))*2.1 + 3.0) - h0,
                         vn3(q + vec3(0,0,e)) + 0.5*vn3((q + vec3(0,0,e))*2.1 + 3.0) - h0) / e;
          gr -= n * dot(gr, n);
          n = normalize(n - gr * amp); }
        float ndv = clamp(-dot(n, v), 0.0, 1.0);
        // ② 박막: 두께 d(nm) = 기본 + 표면에 붙은 얼룩(반복 노이즈). 접힌 곳(노이즈가 높은 가장자리)은 막이 얇아짐
        float nz = vn3(vec3(vP.x*2.2, vP.y*0.9, vP.z*1.6) + loopOff(1.0, 0.9) + 3.0);
        float thin = smoothstep(1.0 - uThin, 1.0 - uThin*0.4, vn3(vP*3.6 + loopOff(2.0, 1.4) + 31.0)) * smoothstep(0.7, 0.25, ndv) * (0.6 + 0.6*smoothstep(0.1, -0.8, vP.y));   // 아래쪽 가장자리에 더 많음
        float sinT2 = (1.0 - ndv*ndv)/(1.33*1.33), cosT = sqrt(1.0 - sinT2);
        // 두께 분포: 광로차가 정면 약 1075nm(보라·분홍) → 비스듬한 곳 약 1225nm(청록)가 되게, 두께가 가장자리로 갈수록 두꺼움(원본 반지름별 색에서 거꾸로)
        float opdT = uD0 + uD1*smoothstep(0.98, 0.74, ndv) + uDn*(nz - 0.5)*2.0*smoothstep(0.5, 0.85, ndv) + (10.0 + 130.0*(vn3(vP*4.2 + loopOff(1.0, 1.1) + 83.0) - 0.5))*smoothstep(0.75, 0.3, ndv);   // 가장자리 두께 얼룩 → 청록·초록·파랑이 섞임
        float d = mix(opdT / (2.0*1.33*cosT), 200.0, thin);
        vec3 Rf = film(2.0*1.33*d*cosT);
        // ① 굴절 두 번(채널마다): 앞면 굴절 → 공 근사 현으로 뒷면 점 → 뒷면 굴절
        vec3 pS = vP / vec3(1.0, 1.0, uZ);                        // 덩어리 공간 단위 공 위의 점(앞뒤 두께 보정)
        vec3 iors = vec3(1.42, 1.47, 1.54), T;
        mat3 toObj = mat3(uInv), toW = mat3(uGrp);
        for (int c = 0; c < 3; c++){
          float io = iors[c];
          vec3 t = refract(v, n, 1.0/io);
          vec3 to = normalize(toObj * t);
          float L = max(0.05, -2.0*dot(pS, to));
          vec3 pe = pS + to*L;
          vec3 nb = normalize(pe + uNbN*(vec3(vn3(pe*2.3 + loopOff(1.0, 1.3) + 61.0), vn3(pe*2.3 + loopOff(1.0, 1.3) + 67.0), vn3(pe*2.3 + 71.0)) - 0.5));
          vec3 o = refract(to, -nb, io);
          if (dot(o, o) < 1e-4) { vec3 r1 = reflect(to, -nb); o = refract(r1, normalize(-pe), io); if (dot(o, o) < 1e-4) o = r1; }   // 전반사: 안에서 한 번 튕겨 반대편으로
          T[c] = envS(normalize(toW * o))[c] * exp(-uAbs*L);                                      // 유리를 지나는 길이만큼 조금 흡수
        }
        // ③ 프레넬: 반사는 박막색으로 물든 환경, 투과는 보색으로 물듦
        float F = uF0 + (1.0 - uF0)*pow(1.0 - ndv, 5.0);
        vec3 rf = reflect(v, n);
        vec3 refl = envS(rf);
        vec3 fc = Rf / max(max(Rf.r, Rf.g), max(Rf.b, 1e-3));                                        // 막 색의 색조
        float k = mix(uK0, uK1, smoothstep(0.95, 0.5, ndv));
        k = mix(k, 1.0, thin);
        vec3 col = T * mix(vec3(1.0), fc, k) * (1.0 - F) + refl * (F + 0.35*thin) * mix(vec3(1.0), Rf*2.2, uKR);   // 투과광을 박막색으로 물들임(블렌더식 색 곱, 실제보다 과장)
        gl_FragColor = vec4(grain(col), 1.0);
      }`,
  });
}

/* ---------- 거리함수(안쪽 음수, 월드 단위, 오브젝트 중심 기준) ----------
   조금 납작한 공(앞뒤 두께 0.85배). 울퉁불퉁한 윤곽·앞면 굴곡은 재질의 정점 셰이더가 덧입힘 */
function blobSDF(R) {
  const rx = R, ry = R, rz = R * 0.85;
  return (x, y, z) => {
    const k0 = Math.hypot(x / rx, y / ry, z / rz), k1 = Math.hypot(x / (rx * rx), y / (ry * ry), z / (rz * rz));
    return k1 < 1e-9 ? -rz : k0 * (k0 - 1) / k1;
  };
}

/* ---------- 오브젝트(원본 픽셀에서 잰 배치) ----------
   덩어리 중심 평균 (358.7, 639.8)px, 평균 반지름 144.2px(방향·시간에 따라 127~164px) */
const LAYOUT = [
  { name: 'blob', px: [358.7, 639.8], z: 0, voice: 'toy', note: 220.00,   // A3
    sdf: blobSDF(R), grid: 76 },
];
/* 화음 모드(sound-clay 5-1절): 04~06과 같은 키(A 장화음 A·C#·E). 덩어리 하나가 A3을 맡음(toy가 2~3음을 흩어 쳐서 화음이 됨) */
const KEY = { rootHz: 110, scale: 'chord' };

const jellies = LAYOUT.map((L, i) => {
  const material = makeBlobMaterial();
  const group = new THREE.Group(); scene.add(group);
  const [hx, hy] = px2w(...L.px);
  const home = new THREE.Vector3(hx, hy, L.z);
  group.position.copy(home);
  return { name: L.name, index: i, group, material, home, voice: L.voice, note: L.note, sdf: L.sdf, grid: L.grid, clay: null };
});
window.__jellies = jellies; window.__cam = camera;
// 조율용: ?u=uK0:0.4,uNbK:1 → 재질 값 바꿔 보기(비교 렌더할 때만 씀)
if (q.get('u')) q.get('u').split(',').forEach(kv => { const [k, v] = kv.split(':'); const U = jellies[0].material.uniforms[k]; if (U) U.value = +v; });

/* =================================================================
   ▼▼▼ sound-clay 붙이는 자리 (HOOK) — 06 젤리 방울 화면과 같은 구조 ▼▼▼
   ================================================================= */
let FEEL = null;
const FEEL_LS = 'soundclay.rainbowblob.feel.v1';
function attachSoundClay(j) {
  j.clay = createSoundClay({
    THREE, MarchingCubes, parent: j.group, camera, canvas: renderer.domElement,
    material: j.material,                                // 원본 재질(무지갯빛 유리 덩어리)이 마칭큐브 표면에 그대로
    base: SHAPES.custom(j.sdf),                          // 실제 모양: 조금 납작한 공
    voice: j.voice, mute: MUTE, feel: FEEL,
    rotateOnEmptyDrag: false,
    exclusiveVoice: false,                               // 만진 덩어리는 계속 노래 — 멈추기는 '모두 멈춤'
    key: KEY, note: j.note,
    rules: { grid: { resolution: j.grid } },
    onFeelChange: f => { saveFeel(f); feelPanel && feelPanel.refresh(); },
  });
  return j.clay;
}
function saveFeel(f) { try { localStorage.setItem(FEEL_LS, JSON.stringify(f)); } catch (_) {} }
/* ▲▲▲ HOOK 끝 ▲▲▲ */

const clays = () => jellies.filter(d => d.clay).map(d => d.clay);
const activeJ = () => jellies.find(d => d.clay && d.clay.active) || null;
const targetJ = () => activeJ() || jellies[0];

/* ---------- 컨트롤(H 키로 표시) ---------- */
let feelPanel = null;
function buildUI() {
  const ctl = document.getElementById('ctl');
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; ctl.appendChild(b); return b; };
  const sel = document.createElement('select');
  VOICES.forEach(v => { const op = document.createElement('option'); op.value = v; op.textContent = '목소리: ' + v; sel.appendChild(op); });
  sel.onchange = () => { const d = targetJ(); d.clay.setVoice(sel.value); d.voice = sel.value; };
  ctl.appendChild(sel);
  const snd = btn('🔊 소리', () => { const d = targetJ(); d.clay.state.playing ? d.clay.stop() : d.clay.start(); });
  btn('■ 모두 멈춤', () => clays().forEach(c => c.state.playing && c.stop()));
  let listener = null;
  const micB = btn('🎤 내 목소리', async () => {
    if (listener && listener.clay.listening === 'MIC') { listener.clay.stopListening(); listener = null; }
    else { stopAllListening(); listener = targetJ(); listener.clay.activate();
      try { await listener.clay.listen('mic'); } catch (e) { alert('마이크를 못 열었어(내장 브라우저 창에선 막힘 → 크롬 localhost로): ' + e.message); listener = null; } }
    showListen(); });
  const fileB = btn('🎵 음성 파일', () => { if (listener && listener.clay.listening === 'FILE') { listener.clay.stopListening(); listener = null; showListen(); } else afile.click(); });
  const afile = document.createElement('input'); afile.type = 'file'; afile.accept = 'audio/*'; afile.style.display = 'none'; document.body.appendChild(afile);
  const playFile = async f => { stopAllListening(); listener = targetJ(); listener.clay.activate();
    try { await listener.clay.listen(f); } catch (e) { alert('음성 파일을 못 읽었어: ' + e.message); listener = null; } showListen(); };
  afile.onchange = () => { if (afile.files[0]) playFile(afile.files[0]); afile.value = ''; };
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = [...e.dataTransfer.files].find(x => x.type.startsWith('audio/') || /\.(wav|mp3|m4a|ogg|flac|webm)$/i.test(x.name)); if (f) playFile(f); });
  function stopAllListening() { clays().forEach(c => c.listening && c.stopListening()); listener = null; }
  function showListen() { const l = listener && listener.clay.listening;
    micB.textContent = l === 'MIC' ? '⏹ 목소리 끄기 (' + listener.name + ')' : '🎤 내 목소리';
    fileB.textContent = l === 'FILE' ? '⏹ 파일 끄기 (' + listener.name + ')' : '🎵 음성 파일'; }
  const feelB = btn('감각', () => document.getElementById('feel').classList.toggle('off'));
  btn('↺ 덩어리 초기화', () => targetJ().clay.reset());
  feelPanel = buildFeelPanel(feelB);
  return { sel, snd };
}
function buildFeelPanel(feelB) {
  const fp = document.getElementById('feel');
  fp.innerHTML = '<b style="font-size:12px">감각 프리셋 (덩어리)</b>';
  const setAll = f => { clays().forEach(c => c.setFeel(f)); };
  const cur = () => (jellies[0].clay).getFeel(nameIn.value || 'blob');
  const rows = {};
  const nameIn = document.createElement('input'); nameIn.type = 'text'; nameIn.value = (FEEL && FEEL.name) || '기본';
  fp.appendChild(nameIn);
  FEEL_SCHEMA.forEach(f => {
    const row = document.createElement('label'), top = document.createElement('div'), name = document.createElement('span'), t = document.createElement('span');
    name.textContent = f.label; const r = document.createElement('input'); r.type = 'range'; r.min = f.min; r.max = f.max; r.step = f.step;
    const d = Math.max(0, -Math.floor(Math.log10(f.step)));
    r.oninput = () => { setAll({ values: { [f.key]: +r.value } }); t.textContent = (+r.value).toFixed(d); saveFeel(cur()); };
    top.append(name, t); row.append(top, r); fp.appendChild(row); rows[f.key] = { r, t, d };
  });
  const bar = document.createElement('div'); bar.className = 'bar'; fp.appendChild(bar);
  const mkB = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; bar.appendChild(b); };
  const refresh = () => { const v = jellies[0].clay.getFeel().values; for (const k in rows) { rows[k].r.value = v[k]; rows[k].t.textContent = (+v[k]).toFixed(rows[k].d); } };
  mkB('복사', async () => { const s = JSON.stringify(cur(), null, 2); try { await navigator.clipboard.writeText(s); feelB.textContent = '감각 ✓복사'; setTimeout(() => feelB.textContent = '감각', 1200); } catch (_) { alert(s); } });
  mkB('파일로 저장', () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(cur(), null, 2)], { type: 'application/json' })); a.download = `sound-clay-feel_${nameIn.value || 'blob'}.json`; a.click(); });
  const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = '.json,application/json'; fileIn.style.display = 'none'; fp.appendChild(fileIn);
  fileIn.onchange = async () => { const f = fileIn.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); setAll(j); if (j.name) nameIn.value = j.name; refresh(); saveFeel(cur()); } catch (e) { alert('프리셋을 읽지 못했어: ' + e.message); } fileIn.value = ''; };
  mkB('불러오기', () => fileIn.click());
  mkB('기본값', () => { const v = {}; FEEL_SCHEMA.forEach(f => v[f.key] = f.key === 'stiffness' ? RULES.pull.stiffness : f.key === 'spread' ? RULES.pull.spread : f.key.split('.').reduce((a, k) => a[k], RULES));
    if (FEEL_DEFAULT) Object.assign(v, FEEL_DEFAULT.values); setAll({ values: v }); nameIn.value = '기본'; refresh(); saveFeel(cur()); });
  refresh();
  return { refresh };
}

/* ---------- HUD(H 키): 덩어리의 MIX RATIO · SHAPE → VOICE ---------- */
const hudEl = document.getElementById('hud');
hudEl.innerHTML = `<div id="hName" class="row" style="margin-top:0"></div>
  <h4>MIX RATIO</h4><div id="hF0" class="sub"></div><div class="rule"></div>` +
  WAVES.map((w, i) => `<div class="row"><span>${w}</span><span id="hp${i}"></span></div><div class="bar" id="hb${i}" style="width:0"></div><div class="track"></div>`).join('') +
  `<h4>SHAPE → VOICE</h4><div class="rule"></div>` +
  [['SIZE', 'PITCH'], ['STRETCH', 'GLIDE'], ['HORN', 'TRILL'], ['LEAN', 'VIBRATO'], ['FLAT', 'NOTE LEN'], ['VOLUME', 'RING']]
    .map(([a, b], i) => `<div class="row"><span>${a}</span><span id="hs${i}"></span></div><div class="sub">→ ${b}</div>`).join('') +
  `<div id="hTag" class="sub" style="margin-top:8px"></div>`;
const $ = id => document.getElementById(id);
function drawHud() {
  const d = targetJ(); if (!d || !d.clay) return;
  const c = d.clay, St = c.state, V = St.voice;
  $('hName').innerHTML = `<span>${d.name.toUpperCase()} · ${c.voice.toUpperCase()}</span><span>${St.playing ? '♪' : (c.listening || '—')}</span>`;
  $('hF0').textContent = St.f0 > 0 ? 'f0 ' + (St.f0 / 1000).toFixed(2) + ' kHz' : 'f0 — (no pitch)';
  St.share.forEach((s, k) => { $('hp' + k).textContent = (s * 100).toFixed(s < 0.1 && s > 0 ? 1 : 0) + '%'; $('hb' + k).style.width = (100 * s).toFixed(1) + '%'; });
  const v = [V.pitch, V.sweep, V.rate, V.vib, V.dur, V.ring];
  v.forEach((x, i) => $('hs' + i).textContent = i === 3 ? '±' + x.toFixed(0) + 'Hz' : i === 5 ? (x * 100).toFixed(0) + '%' : '×' + x.toFixed(2));
  $('hTag').textContent = St.tag + ' · undo ' + c.history.undo;
  if (ui) { ui.sel.value = c.voice; ui.snd.textContent = St.playing ? '🔇 소리 끄기' : '🔊 소리'; }
}
let showHud = q.has('hud');
const setHud = on => { showHud = on; ['hud', 'ctl', 'hint'].forEach(id => $(id).classList.toggle('off', !on)); if (!on) $('feel').classList.add('off'); };
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && !e.ctrlKey && !e.metaKey && !e.altKey && e.target.tagName !== 'INPUT') setHud(!showHud); });

/* ---------- 시작 ---------- */
let FEEL_DEFAULT = null, ui = null;
fit(); addEventListener('resize', fit);
ENV.render();   // 스튜디오 환경 큐브맵 한 번 찍기
try { FEEL_DEFAULT = await (await fetch('./feel/기본.json')).json(); } catch (_) {}
try { const s = localStorage.getItem(FEEL_LS); FEEL = s ? JSON.parse(s) : FEEL_DEFAULT; } catch (_) { FEEL = FEEL_DEFAULT; }
jellies.forEach(attachSoundClay);
ui = buildUI(); setHud(showHud && !REC);
if (REC) $('hkey').classList.add('off');
window.__clays = clays();

/* ---------- 타임라인 ----------
   원본은 컷 없이 약 8.06초마다 같은 모습으로 돌아오는 반복(8.06초 뒤 10.5초까지는 처음 2.4초가 다시 나옴).
   흐름은 하나: 덩어리가 제자리에서 계속 말랑하게 꿀렁임(윤곽 혹 5~7개가 생기고 사라짐, 앞면 굴곡과 색 얼룩이 같이 흐름).
   → 주기 안 시간 ph = t mod 8.06 하나로 실루엣 표·노이즈 위상(uPh = ph/8.06)을 같이 돌림 */
function applyPhase(t) {
  const d = jellies[0], u = d.material.uniforms;
  const ph = ((t % LOOP) + LOOP) % LOOP;
  shared.uPh.value = ph / LOOP;
  const S = silAt(ph);
  for (let i = 0; i < 64; i++) u.uSil.value[i] = S.r[i];
  d.group.position.set(d.home.x + S.cx * PX, d.home.y - S.cy * PX, d.home.z);
}

let pressing = false;
renderer.domElement.addEventListener('pointerdown', () => pressing = true);
addEventListener('pointerup', () => pressing = false);
let clock = 0, last = 0;
function frame(t, tl = null) {
  shared.uTime.value = t;
  const dt = Math.min(0.1, t - last); last = t; if (!pressing) clock += dt;
  applyPhase(tl != null ? tl : FIXED_T != null ? FIXED_T : clock);
  for (const j of jellies) {
    j.group.updateMatrixWorld(true);
    j.material.uniforms.uInv.value.copy(j.group.matrixWorld).invert();
    j.material.uniforms.uGrp.value.copy(j.group.matrixWorld);
    if (j.clay) { j.clay.update(t); j.material.uniforms.uGrow.value = Math.cbrt(j.clay.state.shape.volume || 1); }
  }
  if (showHud) drawHud();
  renderer.render(scene, camera);
}
window.__frame = frame; window.__silAt = silAt;

if (REC) {
  // 30fps × 10.5초 = 315장, 한 장씩 서버로
  const list = q.get('rec') && q.get('rec') !== '1' ? q.get('rec').split(',').map(Number) : [...Array(NFR).keys()];
  for (const i of list) {
    const t = i / FPS; frame(t, t);
    const blob = await new Promise(r => renderer.domElement.toBlob(r, 'image/png'));
    await fetch('/frame/' + i, { method: 'POST', body: blob });
  }
  document.title = 'REC DONE';
} else {
  const loop = ms => { frame(ms / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
