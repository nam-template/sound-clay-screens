<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
// 모듈 사본(원본·관리: ../../03_소리찰흙/작업/sound-clay.js — 여기서는 고치지 않음, 새 판은 다시 복사)
import { createSoundClay, SHAPES, VOICES, WAVES, FEEL_SCHEMA, RULES } from './sound-clay.js';

/* ---------------------------------------------------------------
   옵션
   ?mute=1   → 소리 계산만, 스피커 출력 없음(테스트는 항상 이걸로)
   ?t=5      → 레퍼런스 타임라인(0~9.96초)의 그 순간에 멈춤(정지 비교용)
   ?still=1  → 움직임 멈춤(t=0 모습)
   ?hud=1    → 패널·버튼 켠 채로 시작(기본은 꺼짐, H 키로 토글)
   ?rec=1    → 720×720, 25fps × 249장 프레임을 로컬 서버(/frame/N)로 보냄(소리 꺼짐). ?rec=0,25,50 → 그 프레임만
   --------------------------------------------------------------- */
/* ---------- 소리 잠금 풀기(06과 같은 블록: 모듈은 그대로, 바깥에서만) ---------- */
const AUDIO = { ctxs: new Set(), err: '' };
{
  const AC0 = window.AudioContext || window.webkitAudioContext;
  if (AC0) {
    window.AudioContext = class extends AC0 { constructor(...a) { super(...a); AUDIO.ctxs.add(this); if (this.state !== 'running') this.resume().catch(() => {}); } };
    if (window.AudioWorklet) {
      const addM = AudioWorklet.prototype.addModule;
      AudioWorklet.prototype.addModule = async function (url, opt) {
        try { return await addM.call(this, url, opt); }
        catch (e) {
          if (!String(url).startsWith('blob:')) { AUDIO.err = e.message; throw e; }
          try { const txt = await (await fetch(url)).text(); return await addM.call(this, 'data:text/javascript;base64,' + btoa(unescape(encodeURIComponent(txt))), opt); }
          catch (e2) { AUDIO.err = e2.message; throw e2; }
        }
      };
    }
  }
  let silent = null, shownAt = 0;
  const unlock = () => {
    AUDIO.ctxs.forEach(c => { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(() => {}); });
    if (!silent) {   // iOS 무음 스위치 우회: 아주 짧은 무음 wav 재생
      silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
      silent.setAttribute('playsinline', ''); silent.play().catch(() => {});
      shownAt = performance.now();
      const tick = () => { const el = document.getElementById('hkey'); if (!el) return;
        if (performance.now() - shownAt > 8000) { el.textContent = 'H'; return; }
        const st = [...AUDIO.ctxs].map(c => c.state).join(',') || '-';
        el.textContent = 'H · 소리 ' + st + (AUDIO.err ? ' · ' + AUDIO.err.slice(0, 40) : ''); setTimeout(tick, 300); };
      tick();
    }
  };
  ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown'].forEach(t => addEventListener(t, unlock, { capture: true, passive: true }));
}
const q = new URLSearchParams(location.search);
const REC = q.has('rec'), MUTE = q.has('mute') || REC;
const FIXED_T = q.has('t') ? +q.get('t') : q.has('still') ? 0 : null;
const FPS = 25, NFR = 249, DUR = (NFR - 1) / FPS;   // 원본: 720×720, 25fps, 249장(9.96초)

/* ---------- 데이터(원본을 0.04초마다 분석해서 만든 값 — 원본 픽셀은 안 들어 있음) ----------
   foam-shapes.png : 셀 윤곽의 부호 있는 거리(0.12초 간격 84장, 장마다 180×180). R = 셀 경계까지 거리(8비트, -24~+40px, 바깥 음수),
                     G = 이웃 셀과 맞닿은 면까지 거리(0~40px, 지금은 안 씀). 셀마다 모서리를 반지름 15px로 둥글게 다듬고 앞뒤 5장을 평균함
   DATA.bub        : 기포 위치·반지름(249장 × 최대 140개, Uint16 x,y(÷65535×720) r(÷100))
   DATA.anchor     : 소리를 붙인 셀 8개가 따라가는 길(0.12초 간격) */
const DATA = JSON.parse(document.getElementById('foamdata').textContent);
const ATL = { res: 180, cols: 10, rows: 9, n: 84, lo: -24, hi: 40 };
const atlasIndex = t => {   // 원본 시각 t → 아틀라스 두 장과 섞는 비율 (마지막 칸은 249번째 장)
  const f = Math.max(0, Math.min(NFR - 1, t * FPS));
  if (f <= 246) { const k = f / 3, i = Math.min(82, Math.floor(k)); return [i, i + 1, k - i]; }
  return [82, 83, (f - 246) / 2];
};

/* ---------- 프레임(원본 720×720) ---------- */
const VW = 720, VH = 720, FOV = 26, CAMZ = 12;
const H = 2 * CAMZ * Math.tan(THREE.MathUtils.degToRad(FOV / 2)), W = H;
const PX = H / VH;                                                                   // 원본 1픽셀 = 월드 길이
const px2w = (x, y) => [(x / VW - 0.5) * W, (0.5 - y / VH) * H];

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: REC });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // 셰이더가 화면 값을 직접 냄(원본 픽셀값 = 셰이더 값)
stage.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.set(0, 0, CAMZ);

const RT_OPT = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true };
const rtClay = new THREE.WebGLRenderTarget(4, 4, RT_OPT), rtH = new THREE.WebGLRenderTarget(4, 4, { ...RT_OPT, depthBuffer: false });
const shared = { uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } };
function fit() {
  let s;
  if (REC) { s = VW; renderer.setPixelRatio(1); }
  else { s = Math.min(innerHeight, innerWidth); renderer.setPixelRatio(Math.min(2, devicePixelRatio) * Math.min(1, 900 / (s * Math.min(2, devicePixelRatio)))); }   // 내부 해상도는 900px까지만
  renderer.setSize(Math.round(s), Math.round(s));
  stage.style.width = stage.style.height = Math.round(s) + 'px';
  const r = Math.round(s * renderer.getPixelRatio());
  shared.uRes.value.set(r, r); rtClay.setSize(r, r); rtH.setSize(r, r);
}

/* =================================================================
   재질 — 높이장 → 법선 → 굴절·반사 (선을 위에 칠하지 않음)
   1) 높이 패스: 셀 윤곽 거리 d로 셀마다 '쿠션' 높이(가장자리는 세워진 메니스커스, 안쪽은 평평)를 만들고,
      기포는 둥근 오목(공기 방울), 소리찰흙으로 당긴 모양은 그 위에 더함(rtClay)
   2) 합성 패스: 높이의 기울기로 법선 → 굴절(채널마다 굴절률 조금씩 다름)로 뒤 배경 그라데이션을 다시 읽고,
      프레넬만큼 어두운 방·소프트박스·아래 살구빛을 반사. 테두리의 짙은 띠·위쪽 주황 실선·하얀 반짝임·셀 사이 이중선이 모두 여기서 나옴
   ================================================================= */
const BG = [[19,36,58],[23,42,66],[31,51,72],[38,58,79],[46,67,88],[55,79,100],[64,93,113],[70,100,119],[75,106,125],[82,114,131],[89,121,138],[96,129,143],[106,137,150],[119,145,155],[132,151,160],[144,156,162],[155,159,162],[163,161,162],[172,164,162],[178,167,163],[189,171,164],[198,177,168],[203,183,171],[205,184,173],[204,185,176]];   // 원본 배경 세로 그라데이션(30px 간격, 셀 밖에서 잰 값)
const LOOK = {
  rimW: 22, height: 20, pow: 2.0,   // 메니스커스 폭·높이(px), 단면 모양(2 = 원호, 클수록 가장자리가 더 세워짐)
  ior: [1.325, 1.333, 1.345],  // 채널별 굴절률(분산)
  backDist: 1300,              // 액체 바닥에서 배경판까지 거리(px)
  trans: [0.955, 0.952, 0.945],// 액체를 지나며 남는 빛(원본: 셀 안 ≈ 셀 밖 × 0.95)
  gap: -99,                    // (끔) 맞닿은 면에서 더 물러나는 양 — 윤곽 데이터가 이미 셀마다 따로라서 안 씀
  shrink: 4,                   // 셀 윤곽을 안으로 줄이는 양(px) → 맞닿은 셀 사이 틈
  bubSize: 0.9,                // 기포 반지름 배율(검출한 어두운 고리 기준)
  bubDepth: 0.6,               // 기포 오목 깊이(반지름 배)
  winX: 80, winTop: -40, winBot: 200,  winS: 220,   // 배경판(빛 받는 판)이 화면 밖으로 옆·위·아래 이만큼 더 있고, 그 너머는 어두운 방(px). 위쪽은 화면 안에서 이미 어두워짐
  dark: [0.02, 0.03, 0.045],   // 배경판 밖(어두운 방)
  soft: [12, 8],               // 오른쪽·왼쪽 세로 소프트박스 밝기(반사)
};
try { Object.assign(LOOK, JSON.parse(q.get('look') || '{}')); } catch (_) {}   // 조율용: ?look={"rimW":20}
const GLSL = /* glsl */`
  uniform float uTime; uniform vec2 uRes;
  uniform vec3 uBG[25]; uniform vec4 uWin; uniform vec3 uDark;
  vec3 bgAt(float y){   // y: 원본 px(위 0 → 아래 720), 범위 밖은 끝 색에서 조금 더 짙게/옅게
    float k = clamp(y / 30.0, 0.0, 23.999); int i = int(floor(k)); float f = k - float(i);
    vec3 c = mix(uBG[i], uBG[i+1], f) / 255.0;
    return c;
  }
  // 굴절된 시선이 닿는 배경판: 화면 밖 uWin.x까지 그라데이션, 그 너머는 어두운 방으로 넘어감
  vec3 board(vec2 q){
    float m = uWin.x, s = uWin.w;
    float w = smoothstep(-m - s, -m, q.x) * smoothstep(720.0 + m + s, 720.0 + m, q.x) * smoothstep(-uWin.y - s, -uWin.y, q.y) * smoothstep(720.0 + uWin.z + s, 720.0 + uWin.z, q.y);
    return mix(uDark, bgAt(q.y), w);
  }
`;

// 1) 높이 패스
const NBUB = 140;
const heightMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uAtlas: { value: null }, uA: { value: new THREE.Vector3() }, uBub: { value: null }, uBubRow: { value: 0 }, uClay: { value: rtClay.texture },
    uRimW: { value: LOOK.rimW }, uHgt: { value: LOOK.height }, uPow: { value: LOOK.pow }, uShrink: { value: LOOK.shrink }, uGap: { value: LOOK.gap }, uBubS: { value: LOOK.bubSize }, uBubD: { value: LOOK.bubDepth } },
  depthTest: false, depthWrite: false,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: /* glsl */`
    precision highp float;
    uniform vec2 uRes; uniform sampler2D uAtlas, uBub, uClay; uniform vec3 uA; uniform float uBubRow, uRimW, uHgt, uBubD, uPow, uShrink, uBubS; uniform float uGap;
    // 아틀라스 한 장을 3차 B-스플라인으로 읽음(선형 보간이면 4px 칸 경계마다 법선이 꺾여 테두리에 계단 무늬가 생김)
    vec2 tex1(float col, float row, vec2 c){   // c: 장 안 텍셀 좌표(0~180)
      c = clamp(c, vec2(0.5), vec2(179.5));
      return texture2D(uAtlas, vec2((col + c.x / 180.0) / 10.0, (row + c.y / 180.0) / 9.0)).rg;
    }
    vec2 tile(float i, vec2 p){
      float col = mod(i, 10.0), row = floor(i / 10.0);
      vec2 x = p / 4.0 - 0.5, f = fract(x), ix = floor(x);
      vec2 w0 = (1.0 - f)*(1.0 - f)*(1.0 - f)/6.0, w1 = (4.0 - 6.0*f*f + 3.0*f*f*f)/6.0, w2 = (1.0 + 3.0*f + 3.0*f*f - 3.0*f*f*f)/6.0, w3 = f*f*f/6.0;
      vec2 g0 = w0 + w1, g1 = w2 + w3, h0 = ix - 1.0 + w1/g0, h1 = ix + 1.0 + w3/g1;   // 선형 읽기 4번으로 16점
      return g0.y*(g0.x*tex1(col,row,h0+0.5) + g1.x*tex1(col,row,vec2(h1.x,h0.y)+0.5)) + g1.y*(g0.x*tex1(col,row,vec2(h0.x,h1.y)+0.5) + g1.x*tex1(col,row,h1+0.5));
    }
    void main(){
      vec2 uv = gl_FragCoord.xy / uRes, p = vec2(uv.x, 1.0 - uv.y) * 720.0;
      vec2 dg = mix(tile(uA.x, p), tile(uA.y, p), uA.z);
      float d = dg.x * ${(ATL.hi - ATL.lo).toFixed(1)} + ${ATL.lo.toFixed(1)} - uShrink;   // 액체 가장자리까지 거리(바깥 음수)
      float g = dg.y * 40.0;                                                              // 이웃 셀과 맞닿은 면까지 거리
      d = min(d, g - uGap);                                                               // 맞닿은 면에서 양쪽으로 uGap씩 물러나 맨유리 틈(원본: 셀마다 제 테두리)
      // 셀 쿠션: 가장자리는 거의 수직으로 서고(접촉각) 안쪽으로 둥글게 평평해짐
      float s = clamp(d / uRimW, 0.0, 1.0);
      float h = d > 0.0 ? uHgt * pow(max(0.0, 1.0 - pow(1.0 - s, uPow)), 1.0/uPow) : 0.0;
      // 기포: 액체 속 공기 방울 = 둥근 오목(가장자리 가파름 → 짙은 고리, 가운데 평평 → 밝음)
      for (int i = 0; i < ${NBUB}; i++){
        vec4 b = texture2D(uBub, vec2((float(i) + 0.5) / ${NBUB}.0, uBubRow));
        if (b.z <= 0.0) break;
        float r = b.z * uBubS, q = length(p - b.xy) / r;
        if (q < 1.0) h -= uBubD * r * sqrt(1.0 - q*q) * smoothstep(0.0, 2.0, d);
      }
      // 소리찰흙으로 당기고·누른 만큼(마칭큐브 삼각형 면이 각지게 보이지 않게 3×3으로 살짝 펴서 읽음)
      vec2 tx = 2.0 / uRes; vec4 c = vec4(0.0);
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) c += texture2D(uClay, uv + vec2(float(i), float(j)) * tx);
      c /= 9.0;
      h += c.r - c.g;
      gl_FragColor = vec4(h, d, 0.0, 1.0);
    }`,
});

// 2) 합성 패스
const compMat = new THREE.ShaderMaterial({
  uniforms: { ...shared, uH: { value: rtH.texture }, uBG: { value: BG.map(c => new THREE.Vector3(...c)) },
    uWin: { value: new THREE.Vector4(LOOK.winX, LOOK.winTop, LOOK.winBot, LOOK.winS) }, uDark: { value: new THREE.Vector3(...LOOK.dark) },
    uSoft: { value: new THREE.Vector2(...LOOK.soft) }, uIor: { value: new THREE.Vector3(...LOOK.ior) }, uBack: { value: LOOK.backDist }, uTrans: { value: new THREE.Vector3(...LOOK.trans) } },
  depthTest: false, depthWrite: false,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: GLSL + /* glsl */`
    uniform sampler2D uH; uniform vec3 uIor, uTrans; uniform float uBack; uniform vec2 uSoft;
    float hgt(vec2 o){ return texture2D(uH, (gl_FragCoord.xy + o) / uRes).r; }
    float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
    // 반사되는 주변: 위는 어두운 방, 왼쪽 위·오른쪽 위에 길쭉한 소프트박스, 아래쪽은 배경의 살구빛
    vec3 env(vec3 r){
      vec3 c = vec3(0.035, 0.045, 0.06);
      c += vec3(0.80, 0.62, 0.50) * 0.55 * smoothstep(0.1, -0.8, r.y) * smoothstep(0.95, 0.4, r.z);   // 아래(살구 배경)
      c += vec3(0.20, 0.30, 0.42) * 0.35 * smoothstep(0.0, 0.8, r.y) * smoothstep(0.95, 0.4, r.z);    // 위(남색 배경)
      // 세로로 긴 소프트박스 두 개(왼쪽 강하게, 오른쪽 약하게): 방위각은 좁고 높이각은 넓어서 셀 옆면에 세로 하얀 줄이 생김
      float az = atan(r.y, r.x), el = r.z;
      float s1 = exp(-pow(az / 0.22, 2.0)) * smoothstep(0.02, 0.2, el) * smoothstep(0.7, 0.4, el);                 // 오른쪽
      float s2 = exp(-pow((abs(az) - 3.05) / 0.2, 2.0)) * smoothstep(0.02, 0.2, el) * smoothstep(0.7, 0.4, el);     // 왼쪽

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes, p = vec2(uv.x, 1.0 - uv.y) * 720.0;
      float tp = 720.0 / uRes.x;                           // 한 텍셀 = 원본 몇 px
      vec4 c0 = texture2D(uH, uv);
      float h = c0.r;
      float gx = (hgt(vec2(1.0, 0.0)) - hgt(vec2(-1.0, 0.0))) / (2.0*tp);
      float gy = (hgt(vec2(0.0, 1.0)) - hgt(vec2(0.0, -1.0))) / (2.0*tp);   // 화면 위쪽(+y)
      vec3 n = normalize(vec3(-gx, -gy, 1.0));
      vec3 v = vec3(0.0, 0.0, -1.0);
      float cosi = n.z;
      float F = 0.02 + 0.98 * pow(1.0 - cosi, 5.0);
      bool wet = h > 0.05 || c0.g > -1.0;
      vec3 col;
      for (int k = 0; k < 3; k++){
        float ior = k == 0 ? uIor.x : k == 1 ? uIor.y : uIor.z;
        vec3 t = refract(v, n, 1.0 / ior);
        // 액체 아래면은 평평한 유리판 → 다시 나올 때 한 번 더 꺾임(공기로)
        vec2 off = t.xy / max(-t.z, 0.12) * h;
        vec3 t2 = refract(normalize(vec3(t.xy, t.z)), vec3(0.0, 0.0, 1.0), ior);
        if (dot(t2, t2) < 0.5) t2 = vec3(t.xy, -0.05);
        off += t2.xy / max(-t2.z, 0.08) * uBack;
        vec3 b = board(vec2(p.x + off.x, p.y - off.y));   // 화면 위쪽 +y ↔ 원본 px는 아래로 +
        float tr = k == 0 ? uTrans.x : k == 1 ? uTrans.y : uTrans.z;

/* 기포 데이터 → 텍스처(가로 140 × 세로 249장) */
{
  const raw = Uint8Array.from(atob(DATA.bub), ch => ch.charCodeAt(0));
  const u16 = new Uint16Array(raw.buffer), f = new Float32Array(NFR * NBUB * 4);
  for (let i = 0; i < NFR * NBUB; i++) { f[i*4] = u16[i*3] / 65535 * 720; f[i*4+1] = u16[i*3+1] / 65535 * 720; f[i*4+2] = u16[i*3+2] / 100; }

/* ---------- 소리찰흙 셀의 재질: 화면에 직접 그리지 않고 '쉬는 모양과의 높이 차이'만 rtClay에 씀 ----------
   쉬는 모양 = 아래 거리함수의 위 면 hrest(x,y). 당기면 그보다 솟고(R), 누르면 꺼짐(G). 마칭큐브 격자 오차는 문턱으로 버림 */
const CLAY_R = 1.2, PAD_B = 0.25;
function padTop(r, Hm, Wm) { const din = CLAY_R - r; if (din <= 0) return 0; const s = Math.min(1, din / Wm); return Hm * Math.sqrt(Math.max(0, 1 - (1 - s) * (1 - s))); }
function makeDeltaMaterial(c) {
  return new THREE.ShaderMaterial({
    uniforms: { uHm: { value: c.Hm }, uWm: { value: c.Wm }, uK: { value: c.k }, uCE: { value: RULES.grid.extent } },
    side: THREE.DoubleSide, depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.MaxEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    vertexShader: /* glsl */`
      uniform float uCE; varying vec3 vL; varying vec3 vN;
      void main(){ vL = position * uCE; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform float uHm, uWm, uK; varying vec3 vL; varying vec3 vN;
      void main(){
        if (normalize(vN).z < 0.15) discard;                         // 위를 향한 면만
        float din = ${CLAY_R.toFixed(2)} - length(vL.xy), s = clamp(din / uWm, 0.0, 1.0);
        float hr = din > 0.0 ? uHm * sqrt(max(0.0, 1.0 - (1.0-s)*(1.0-s))) : 0.0;
        float d = vL.z - hr;
        // 격자 오차(쉬는 상태)는 0: 쉬는 면이 가파를수록(가장자리) 마칭큐브 면이 옆으로 조금만 어긋나도 높이 차가 커지므로 문턱을 키움
        float slope = din > 0.0 ? (uHm / uWm) * (1.0 - s) / max(0.08, sqrt(max(0.0, 1.0 - (1.0-s)*(1.0-s)))) : 0.0;
        float tol = 0.06 + 0.12 * min(slope, 6.0) + 0.3 * (1.0 - smoothstep(-0.25, -0.05, din)) * step(din, 0.05);
        d = sign(d) * max(abs(d) - tol, 0.0);
        // 꺼짐은 손으로 판 홈처럼 깊을 때만(부피 맞춤으로 몸통이 고르게 조금 줄어드는 건 화면 셀 윤곽과 어긋나 고리처럼 보여서 뺌)
        float neg = max(-d - 0.10, 0.0);

        gl_FragColor = vec4(max(d, 0.0), neg * uK, 0.0, 1.0);
      }`,
  });
}
function padSDF(Hm, Wm) {
  return (x, y, z) => { const r = Math.hypot(x, y); return Math.max(r - CLAY_R, z - padTop(r, Hm, Wm), -z - PAD_B); };
}
